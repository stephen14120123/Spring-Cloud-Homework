server:
  port: 8082

spring:
  application:
    name: ecommerce-product

  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        namespace: public

  # ==================== MySQL 数据源 ====================
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/ecommerce?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

  # ==================== Redis 缓存 ====================
  redis:
    host: 127.0.0.1
    port: 6379
    database: 0

# MyBatis-Plus 配置（开启下划线→驼峰映射）
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
