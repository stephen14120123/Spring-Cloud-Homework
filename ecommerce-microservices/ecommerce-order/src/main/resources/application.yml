server:
  port: 8084

spring:
  application:
    name: ecommerce-order

  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        namespace: public

    sentinel:
      transport:
        dashboard: 127.0.0.1:8718

  # ==================== MySQL 数据源 ====================
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/ecommerce?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

feign:
  sentinel:
    enabled: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
